[project]
name = "chutes-audit"
version = "0.0.1"
description = "chutes.ai/subnet 64 auditing system"
authors = [{ name = "Jon Durbin", email = "jon@chutes.ai" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aiohttp==3.14.1",
    "asyncpg==0.31.0",
    "sqlalchemy>=2.0.37,<3.0.0",
    "loguru",
    "munch==4.0.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.9.4,<0.10.0",
    "pydantic>=2.9.2,<3.0.0",
    "orjson>=3.10.15,<4.0.0",
    "greenlet>=3.1.1",
    "backoff>=2.2.1",
    "tqdm>=4.67.1",
    "async-substrate-interface>=2.2,<3",
    "bittensor==10.5.0",
    "cyscale",
    "cryptography",
    "setuptools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
